name: V2/V3 quality checks
on:
  push:
    branches: [main, version-2, version-3]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Runtime dependency security audit (release gate)
        run: npm audit --omit=dev --audit-level=high
      - name: Source and asset smoke tests
        run: npm run test:v2
      - name: Appointment message and date regression tests
        run: npm run test:booking
      - name: Username/password and CSRF checks
        run: npm run test:admin && npm run test:security
      - name: Catalog import and image URL regression checks
        run: npm run test:catalog
      - name: Image link and persistent CMS storage regression tests
        run: npm run test:image-links && npm run test:cms-store
      - name: Transactional Postgres CMS regression test
        run: npm run test:cms-postgres
      - name: CMS write/delete validation and authorization regression tests
        run: npm run test:cms-mutations
      - name: Dedicated production Neon migration and cutover protection checks
        run: npm run test:neon-cutover
      - name: Public first-render image regression checks
        run: npm run test:public-images
