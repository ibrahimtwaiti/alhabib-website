name: V2/V3 quality checks
on:
  push:
    branches: [version-2, version-3]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Source and asset smoke tests
        run: npm run test:v2
      - name: Appointment message and date regression tests
        run: npm run test:booking
      - name: Username/password security checks
        run: npm run test:admin
      - name: Catalog import and image URL regression checks
        run: npm run test:catalog
      - name: Image link and persistent CMS storage regression tests
        run: npm run test:image-links && npm run test:cms-store
      - name: Transactional Postgres CMS regression test
        run: npm run test:cms-postgres
      - name: Public first-render image regression checks
        run: npm run test:public-images
      - name: V3 database and upload isolation checks
        run: npm run test:v3
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: HTTP smoke tests for public routes
        run: npm run smoke:http
