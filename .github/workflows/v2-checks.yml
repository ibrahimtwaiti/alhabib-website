name: V2/V3 quality checks
on:
  push:
    branches: [version-2, version-3]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Runtime dependency security audit (release gate)
        run: npm audit --omit=dev --audit-level=high
      - name: Source and asset smoke tests
        run: npm run test:v2
      - name: Appointment message and date regression tests
        run: npm run test:booking
      - name: Dynamic multi-specialty booking and atomic specialist save checks
        run: npm run test:multi-specialty && npm run test:specialist-save
      - name: Username/password security checks
        run: npm run test:admin
      - name: Catalog import and image URL regression checks
        run: npm run test:catalog
      - name: Image link and persistent CMS storage regression tests
        run: npm run test:image-links && npm run test:cms-store
      - name: Transactional Postgres CMS regression test
        run: npm run test:cms-postgres
      - name: CMS write/delete validation and authorization regression tests
        run: npm run test:cms-mutations
      - name: Dedicated production Neon migration and cutover protection checks
        run: npm run test:neon-cutover
      - name: Public first-render image regression checks
        run: npm run test:public-images
      - name: Public social links, admin settings and platform URL checks
        run: npm run test:social
      - name: Approved visual defaults and restore regression tests
        run: npm run test:visual-baseline
      - name: V3 database and upload isolation checks
        run: npm run test:v3
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: HTTP smoke tests for public routes
        run: npm run smoke:http

  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium
      - name: Build for local browser acceptance tests
        run: npm run build
      - name: Chromium acceptance tests
        run: npm run test:browser
      - name: Store browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-v3-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
